name: Build and Deploy Infostaan

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: infostaan-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html

      - name: Deploy to Hostinger FTP
        env:
          HOSTINGERFTPHOST: ${{ secrets.HOSTINGERFTPHOST }}
          HOSTINGERFTPUSERNAME: ${{ secrets.HOSTINGERFTPUSERNAME }}
          HOSTINGERFTPPASSWORD: ${{ secrets.HOSTINGERFTPPASSWORD }}
          HOSTINGERFTPPORT: ${{ secrets.HOSTINGERFTPPORT }}
        run: python scripts/deploy_hostinger.py 2>&1 | tee deploy.log

      - name: Publish deploy log to diagnostic branch
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B deploy-log-branch
          git add deploy.log
          git commit -m "Hostinger deploy log" || true
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy-log-branch || true
