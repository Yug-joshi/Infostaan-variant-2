name: Build and Deploy Infostaan

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infostaan-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html

      - name: Deploy to Hostinger FTP
        env:
          HOSTINGERFTPHOST: ${{ secrets.HOSTINGERFTPHOST }}
          HOSTINGERFTPUSERNAME: ${{ secrets.HOSTINGERFTPUSERNAME }}
          HOSTINGERFTPPASSWORD: ${{ secrets.HOSTINGERFTPPASSWORD }}
          HOSTINGERFTPPORT: ${{ secrets.HOSTINGERFTPPORT }}
        run: python scripts/deploy_hostinger.py
