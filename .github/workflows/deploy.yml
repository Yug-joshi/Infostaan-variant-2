
name: Build and Deploy Infostaan

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infostaan-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html

      
      - name: Inspect FTP Server Structure
        run: |
          echo "=== FTP Root Directory Listing ==="
          curl -s --list-only -u "${{ secrets.HOSTINGERFTPUSERNAME }}:${{ secrets.HOSTINGERFTPPASSWORD }}" "ftp://${{ secrets.HOSTINGERFTPHOST }}:${{ secrets.HOSTINGERFTPPORT }}/" || true
          echo "=== FTP public_html Directory Listing ==="
          curl -s --list-only -u "${{ secrets.HOSTINGERFTPUSERNAME }}:${{ secrets.HOSTINGERFTPPASSWORD }}" "ftp://${{ secrets.HOSTINGERFTPHOST }}:${{ secrets.HOSTINGERFTPPORT }}/public_html/" || true
          echo "## FTP Diagnostics" >> $GITHUB_STEP_SUMMARY
          echo "### FTP Root listing:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          curl -s --list-only -u "${{ secrets.HOSTINGERFTPUSERNAME }}:${{ secrets.HOSTINGERFTPPASSWORD }}" "ftp://${{ secrets.HOSTINGERFTPHOST }}:${{ secrets.HOSTINGERFTPPORT }}/" >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "### FTP public_html listing:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          curl -s --list-only -u "${{ secrets.HOSTINGERFTPUSERNAME }}:${{ secrets.HOSTINGERFTPPASSWORD }}" "ftp://${{ secrets.HOSTINGERFTPHOST }}:${{ secrets.HOSTINGERFTPPORT }}/public_html/" >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload dist contents to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGERFTPHOST }}
          username: ${{ secrets.HOSTINGERFTPUSERNAME }}
          password: ${{ secrets.HOSTINGERFTPPASSWORD }}
          port: ${{ secrets.HOSTINGERFTPPORT }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false
          security: loose
          log-level: verbose
          timeout: 60000
